career-profile:
  title: Career Profile
  summary: |
   Learning & Development professional and Certified Instructor with extensive experience in delivering
   Financial Services, Banking, Compliance, and Soft Skills training, with a strong background in coaching,
   employee development, performance management, and translating business and technical knowledge into
   practical learning experiences.

   Brings substantial corporate experience from Barclays Bank, Allianz, and CitiBank, combined with hands-on
   training experience through professional academies and learning initiatives. Strong ability to understand
   business and learner needs, adapt training to different audiences, and connect learning with workplace
   performance.

