    details: |
     Deliver professional training programs covering Financial Services, Banking, Investment, and Soft
     Skills.
     Facilitate interactive learning sessions using practical examples, discussions, activities, and
     workplace scenarios.
     Develop and adapt training content to suit different learner profiles, business contexts, and learning
     objectives.
     Support learners in translating knowledge into practical workplace skills.
     Develop online learning content and contribute to professional learning initiatives.
     Deliver training through professional academies serving learners in Egypt and Saudi Arabia.

  - role: Monitoring & Training Senior Officer
    time: 2010 - 2017
    company: Barclays Bank
 
details: |
      Delivered and supported professional training initiatives related to Financial Crime, AML, and
      regulatory requirements.
     Served as a Certified Compliance Trainer, translating complex compliance requirements into practical
      learning for employees.
     Supported employee development through training, and practical guidance on compliance and
     financial crime topics.
     Monitored business and compliance practices and identified areas requiring corrective action and
     development.
     Prepared management information and reports to support performance monitoring and informed
     decision-making.
     Strengthen compliance awareness, controls, and employee understanding of regulatory requirements.

  - role: Unit Sales Manager
    time: 2008 - 2010
    company: Barclays Bank
    details: |
      Supported and coached sales team members in acquiring clients and achieving sales objectives.
      Assessed team strengths and weaknesses and managed sales activities accordingly.
      Prepared business administration reports to monitor performance against budget and support
      alternative action plans.
      Provided on-the-ground support to the sales team and coordinated with Compliance on
      potential fraud and risk issues.

